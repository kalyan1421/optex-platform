# Supabase CLI project config. Project ref is filled in after `supabase link`
# against the hosted project.
#
# SCOPE: this file exists for the *hosted* CLI workflows only —
#   supabase link --project-ref <ref>
#   supabase db push --linked
#
# It is NOT the local dev stack. Local Supabase is owned exclusively by
# docker-compose.yml at the repo root (`docker compose up -d supabase-kong`),
# which is what every app's .env points at and what docker/migrate.sh seeds.
#
# Do not run `supabase start`. The ports below mirror the Compose stack
# (54321/54322/54323), so the outcome depends on what is already running:
#   - Compose UP   -> `supabase start` fails on a port collision. Harmless.
#   - Compose DOWN -> `supabase start` SUCCEEDS and binds those same ports with
#                     its own separate volumes. Every app .env then silently
#                     talks to a second, divergent database on identical URLs.
# The second case is the dangerous one and nothing here prevents it — the only
# safeguard is not running the command. Use `docker compose up -d supabase-kong`.

project_id = "optex-ke"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:1112"
additional_redirect_urls = ["http://localhost:1112", "http://localhost:1113", "https://optex-staging.vercel.app"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false   # flip on once SMTP is wired

[storage]
enabled = true
file_size_limit = "10MiB"
