# Supabase CLI project config (run `supabase init` once locally; this file lives in the repo).
# Project ref is filled in after `supabase link` against the hosted project.

project_id = "optex-ke"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "https://optex-staging.vercel.app"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false   # flip on once SMTP is wired

[storage]
enabled = true
file_size_limit = "10MiB"
