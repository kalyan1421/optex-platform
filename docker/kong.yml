# ─────────────────────────────────────────────────────────────────────────────
# Kong declarative config — routes the Supabase local API gateway.
# Kong 2.8.1, DB-less mode (KONG_DATABASE=off).
#
# Port 54321 (Kong HTTP) maps:
#   /auth/v1/*     → supabase-auth:9999   (GoTrue)
#   /rest/v1/*     → supabase-rest:3000   (PostgREST)
#   /storage/v1/*  → supabase-storage:5000
#   /storage/v1/object/public/*  → same, but unauthenticated (public buckets)
#   /pg/*          → supabase-meta:8080   (admin only)
#
# Credentials (well-known local-dev keys — same as `supabase start` defaults):
#   anon key     : eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3MTM0MjUsImV4cCI6MjEwMDA3MzQyNX0.huyd4oVy5PuVy7Bkk2okDXh0zlAx9KgEbNdwMactLuM
#   service key  : eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NDcxMzQyNSwiZXhwIjoyMTAwMDczNDI1fQ.5h1scd1HcpX3H5EZv6OfrbG5af-_eNoCyqNsRwm8ozE
# ─────────────────────────────────────────────────────────────────────────────
_format_version: "1.1"

consumers:
  - username: anon
    keyauth_credentials:
      - key: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3MTM0MjUsImV4cCI6MjEwMDA3MzQyNX0.huyd4oVy5PuVy7Bkk2okDXh0zlAx9KgEbNdwMactLuM
  - username: service_role
    keyauth_credentials:
      - key: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NDcxMzQyNSwiZXhwIjoyMTAwMDczNDI1fQ.5h1scd1HcpX3H5EZv6OfrbG5af-_eNoCyqNsRwm8ozE

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

services:
  # ── Auth open routes (OAuth callbacks / email verify — no key required) ──
  - name: auth-v1-open
    url: http://supabase-auth:9999/
    routes:
      - name: auth-v1-open-callback
        strip_path: true
        paths:
          - /auth/v1/callback
      - name: auth-v1-open-verify
        strip_path: true
        paths:
          - /auth/v1/verify
      - name: auth-v1-open-authorize
        strip_path: true
        paths:
          - /auth/v1/authorize
    plugins:
      - name: cors

  # ── Auth protected routes ────────────────────────────────────────────────
  - name: auth-v1
    url: http://supabase-auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          whitelist:
            - anon
            - admin

  # ── PostgREST ────────────────────────────────────────────────────────────
  - name: rest-v1
    url: http://supabase-rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true
      - name: acl
        config:
          hide_groups_header: true
          whitelist:
            - anon
            - admin

  # ── Storage: public objects (no key — this is what "public bucket" means) ──
  #
  # Must be declared before `storage-v1` and carries no key-auth/acl: a public
  # object is fetched by the browser straight from an <img src>, which sends no
  # apikey header. Without this route the catch-all `/storage/v1/` below
  # answered "No API key found in request" with a 401, so every uploaded
  # product image rendered as a broken image in the admin panel and the
  # storefront. Hosted Supabase already exposes this path unauthenticated;
  # only the local gateway was stricter than production.
  #
  # `strip_path` removes the matched prefix, so the service URL carries the
  # `/object/public` segment to keep the upstream path intact.
  - name: storage-v1-public
    url: http://supabase-storage:5000/object/public
    routes:
      - name: storage-v1-object-public
        strip_path: true
        paths:
          - /storage/v1/object/public
    plugins:
      - name: cors

  # ── Storage ──────────────────────────────────────────────────────────────
  - name: storage-v1
    url: http://supabase-storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true
      - name: acl
        config:
          hide_groups_header: true
          whitelist:
            - anon
            - admin

  # ── Postgres Meta (admin only) ────────────────────────────────────────────
  - name: meta
    url: http://supabase-meta:8080/
    routes:
      - name: meta-all
        strip_path: true
        paths:
          - /pg/
    plugins:
      - name: key-auth
        config:
          hide_credentials: true
      - name: acl
        config:
          hide_groups_header: true
          whitelist:
            - admin
