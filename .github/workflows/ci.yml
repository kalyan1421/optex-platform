name: CI

# The gate Wave 0 called for and Waves 1-2 shipped without. Three of eight
# code-review findings were criticals inside features already marked done,
# because nothing tested them. See docs/SPRINT-01.md.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A new push to the same branch supersedes the run in flight.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Local-dev defaults from the .env.example files. These are the well-known
  # Supabase demo keys signed with the shared local JWT secret — they are not
  # secrets, they only ever address the throwaway stack this workflow starts.
  SUPABASE_URL: http://localhost:54321
  SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3MTM0MjUsImV4cCI6MjEwMDA3MzQyNX0.huyd4oVy5PuVy7Bkk2okDXh0zlAx9KgEbNdwMactLuM
  SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NDcxMzQyNSwiZXhwIjoyMTAwMDczNDI1fQ.5h1scd1HcpX3H5EZv6OfrbG5af-_eNoCyqNsRwm8ozE
  SUPABASE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
  # apps/web and apps/admin read the NEXT_PUBLIC_ names, and `next build`
  # prerenders pages that construct a Supabase client — so these are required
  # for the build, not only at runtime.
  NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3MTM0MjUsImV4cCI6MjEwMDA3MzQyNX0.huyd4oVy5PuVy7Bkk2okDXh0zlAx9KgEbNdwMactLuM
  NEXT_PUBLIC_API_URL: http://localhost:1111

jobs:
  static:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      # Audit F-24: the repo declared `next lint` in two package.json files with
      # no ESLint config or dependency anywhere, so `pnpm -r lint` failed for
      # anyone who ran it — and CI never ran it, which is why that went
      # unnoticed. The config now exists and this is the gate that keeps it
      # honest. `jsx-a11y` is part of it, so the class of problem in F-16
      # (forms that announce nothing to a screen reader) gets caught here
      # rather than in the next audit.
      - name: Lint
        run: pnpm -r lint

      # Audit F-08: the suite was an inverted pyramid — 150 integration tests
      # and zero unit tests, so pure logic (MSISDN normalisation, timestamp
      # formatting, money rounding) was only reachable through HTTP against a
      # real database. These need neither, so they run in the fast static job
      # rather than the one that boots Supabase.
      - name: Unit tests
        run: pnpm -r test

      # `pnpm -r build`, not `pnpm build` — the root `build` script has a
      # `prebuild` that regenerates database.types.ts, which needs the Supabase
      # CLI and a live database. `-r` runs each workspace package's own build
      # and skips the root lifecycle entirely.
      - name: Build
        run: pnpm -r build

      # Code only. The root `format` script also covers Markdown, but the docs
      # are hand-laid-out tables that Prettier reflows wholesale — enforcing it
      # would turn every doc edit into a diff nobody reads. Run
      # `pnpm format` locally if you want Markdown tidied too.
      - name: Check formatting
        run: pnpm exec prettier --check "**/*.{ts,tsx,js,jsx,css}"

  e2e:
    name: API e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The e2e spec boots the whole AppModule and queries real tables, so it
      # needs the stack up and migrated — the same one `pnpm docker:up` starts
      # locally, so a green CI run and a green local run mean the same thing.
      - name: Start Supabase
        run: docker compose up -d supabase-kong

      - name: Apply migrations and seed
        run: docker compose run --rm supabase-migrate

      - name: Run API e2e
        run: pnpm --filter @optex/api test:e2e

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --tail 200

  smoke:
    name: Storefront smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @optex/web exec playwright install --with-deps chromium

      - name: Start Supabase
        run: docker compose up -d supabase-kong

      - name: Apply migrations and seed
        run: docker compose run --rm supabase-migrate

      # /shop is a Server Component now: it fetches the catalogue through the
      # API at build and revalidation time, so the API has to be up before the
      # build runs. Before Wave 4 the page read Supabase from the browser and
      # this job never needed it.
      #
      # AUTH_RATE_LIMIT raised from the 10/min production default (F-01): this
      # suite signs up a real throwaway account per test across several spec
      # files (appointments-booking, promo-redemption, wishlist,
      # checkout-authenticated, cart-merge) and runs them sequentially, which
      # adds up to more than 10 signups inside one run — enough to trip the
      # same ceiling that stops credential stuffing and turn a passing suite
      # into a stray, unrelated-looking 429 on whichever test signs up 11th.
      - name: Start the API
        run: docker compose up -d --build api
        env:
          AUTH_RATE_LIMIT: '200'

      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:1111/api/health >/dev/null 2>&1; then
              echo "API healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy"; docker compose logs api --tail 80; exit 1

      # The suite walks shop → PDP → cart → checkout against a production
      # build (Playwright's webServer runs `pnpm build && pnpm start`), which
      # is the render mode Wave 4 changed.
      - name: Run storefront smoke suite
        run: pnpm --filter @optex/web test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  admin-e2e:
    name: Admin panel e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @optex/admin exec playwright install --with-deps chromium

      - name: Start Supabase
        run: docker compose up -d supabase-kong

      - name: Apply migrations and seed
        run: docker compose run --rm supabase-migrate

      # Every admin page reads through the API — the panel has no direct
      # Supabase access — so the API must be up before Playwright's webServer
      # builds and starts the panel.
      #
      # AUTH_RATE_LIMIT is raised for the same reason the storefront job
      # raises it: this suite signs up a throwaway super_admin in global-setup
      # and more per spec, which adds up past the 10/min production ceiling
      # and would surface as an unrelated-looking 429.
      #
      # MFA_ENFORCEMENT_ENABLED is deliberately NOT disabled here, unlike the
      # API e2e job. R1 1e's step-up is a load-bearing part of what this suite
      # covers: global-setup completes a real RFC 6238 enrollment and
      # challenge through the actual /login and /mfa-challenge screens, and
      # products.spec mints its own aal2 session for the upload endpoint.
      # Turning enforcement off would make those paths pass without proving
      # anything.
      - name: Start the API
        run: docker compose up -d --build api
        env:
          AUTH_RATE_LIMIT: '200'

      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:1111/api/health >/dev/null 2>&1; then
              echo "API healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy"; docker compose logs api --tail 80; exit 1

      # Playwright's webServer runs `pnpm build && pnpm start`, so this covers
      # the admin panel as a production build — including middleware.ts, which
      # is the whole auth gate and behaves differently in dev.
      - name: Run admin e2e suite
        run: pnpm --filter @optex/admin test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: admin-playwright-report
          path: apps/admin/playwright-report
