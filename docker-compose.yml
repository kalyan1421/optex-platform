# ─────────────────────────────────────────────────────────────────────────────
# OPTEX — full local dev stack
#
# Brings up:
#   • Supabase (postgres, auth, rest, storage, meta, kong gateway, studio)
#   • supabase-migrate   — one-shot idempotent migration runner
#   • api                — NestJS backend on :1111
#
# Usage:
#   docker compose up --build          # first run (builds api image)
#   docker compose up                  # subsequent runs
#   docker compose up supabase-studio  # open Studio UI at :54323
#   docker compose down -v             # tear down + wipe volumes
#
# Supabase local endpoints:
#   API gateway  http://localhost:54321   (set NEXT_PUBLIC_SUPABASE_URL)
#   Studio       http://localhost:54323
#   Postgres     localhost:54322 (user: postgres, password: see POSTGRES_PASSWORD)
#
# Standard local-dev credentials (safe to commit — these are the well-known
# Supabase demo keys, identical to what `supabase start` generates):
#   JWT secret   super-secret-jwt-token-with-at-least-32-characters-long
#   anon key     eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3MTM0MjUsImV4cCI6MjEwMDA3MzQyNX0.huyd4oVy5PuVy7Bkk2okDXh0zlAx9KgEbNdwMactLuM
#   service key  eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NDcxMzQyNSwiZXhwIjoyMTAwMDczNDI1fQ.5h1scd1HcpX3H5EZv6OfrbG5af-_eNoCyqNsRwm8ozE
# ─────────────────────────────────────────────────────────────────────────────

x-supabase-common: &supabase-common
  POSTGRES_PASSWORD: your-super-secret-and-long-postgres-password
  POSTGRES_HOST: supabase-db
  POSTGRES_PORT: '5432'
  POSTGRES_DB: postgres
  JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
  ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3MTM0MjUsImV4cCI6MjEwMDA3MzQyNX0.huyd4oVy5PuVy7Bkk2okDXh0zlAx9KgEbNdwMactLuM
  SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NDcxMzQyNSwiZXhwIjoyMTAwMDczNDI1fQ.5h1scd1HcpX3H5EZv6OfrbG5af-_eNoCyqNsRwm8ozE

services:
  # ─── POSTGRES ───────────────────────────────────────────────────────────────
  supabase-db:
    image: supabase/postgres:15.1.0.117
    restart: unless-stopped
    healthcheck:
      test: pg_isready -U postgres -h localhost
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - '54322:5432'
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: '5432'
      POSTGRES_PORT: '5432'
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: your-super-secret-and-long-postgres-password
      PGPASSWORD: your-super-secret-and-long-postgres-password
      JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      JWT_EXP: '3600'
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal

  # ─── ROLE PASSWORDS (one-shot, idempotent) ────────────────────────────────
  # Must run before gotrue/postgrest/storage start — they authenticate with the
  # shared password, which the base image does not set. Split out of
  # migrate.sh because migration 0001 needs `auth.jwt()`, which only exists
  # once gotrue has started; see docker/set-role-passwords.sh.
  supabase-roles:
    image: postgres:15-alpine
    restart: on-failure
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PGHOST: supabase-db
      PGPORT: '5432'
      PGDATABASE: postgres
      PGPASSWORD: your-super-secret-and-long-postgres-password
    volumes:
      - ./docker/set-role-passwords.sh:/set-role-passwords.sh:ro
    command: ['sh', '/set-role-passwords.sh']

  # ─── MIGRATIONS (one-shot, idempotent) ────────────────────────────────────
  supabase-migrate:
    image: postgres:15-alpine
    restart: on-failure
    depends_on:
      # Not just the DB. Our migrations sit on top of schemas the Supabase
      # services own and create at boot:
      #   0001 references auth.jwt()            → needs gotrue migrated
      #   0003 inserts storage.buckets(public)  → needs storage-api migrated
      #                                           (the base image ships an
      #                                           older buckets table without
      #                                           that column)
      supabase-auth:
        condition: service_healthy
      supabase-storage:
        condition: service_healthy
    environment:
      PGHOST: supabase-db
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: your-super-secret-and-long-postgres-password
    volumes:
      - ./Backend/supabase/migrations:/migrations:ro
      - ./Backend/supabase/seed.sql:/seed.sql:ro
      - ./docker/migrate.sh:/migrate.sh:ro
    command: ['sh', '/migrate.sh']

  # ─── GOTRUE AUTH ────────────────────────────────────────────────────────────
  supabase-auth:
    image: supabase/gotrue:v2.143.0
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-roles:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9999/health']
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: '9999'
      API_EXTERNAL_URL: http://localhost:54321
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:your-super-secret-and-long-postgres-password@supabase-db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:1112
      GOTRUE_URI_ALLOW_LIST: 'http://localhost:1112,http://localhost:1113,https://optex-staging.vercel.app'
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: '3600'
      GOTRUE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: 'false'
      GOTRUE_LOG_LEVEL: ERROR
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      # GoTrue's confirmation-mail dispatch still counts against its own
      # internal signup rate limiter even with GOTRUE_MAILER_AUTOCONFIRM=true
      # (no mail actually goes out, but the attempt increments
      # gotrue_email_rate_limit_counter). The default is 30/hour — far below
      # what one full local run of the API's ~200-test e2e suite needs, since
      # most suites sign up a fresh throwaway account per test. Raised, not
      # disabled, so a genuine runaway loop still trips something.
      GOTRUE_RATE_LIMIT_EMAIL_SENT: '10000'
      # Signup under GOTRUE_MAILER_AUTOCONFIRM still runs through GoTrue's
      # verify/token-issuance path internally; raising email-sent alone did
      # not stop "Request rate limit reached" partway through a full local
      # e2e run, so this is raised too rather than half-fixing the same class
      # of failure.
      GOTRUE_RATE_LIMIT_VERIFY: '10000'
      # CR-01 R1 1e — Super Admin 2FA (SPEC-08). Var names confirmed against
      # this image's pinned tag (supabase/auth @ v2.143.0,
      # internal/conf/configuration.go's MFAConfiguration struct), not
      # guessed. TOTP is the only factor type this GoTrue version supports —
      # enabling MFA here is what turns on the /factors enrollment/challenge
      # endpoints the `auth.mfa.*` client SDK calls. Everything else
      # (challenge expiry, rate limits, max factors) keeps GoTrue's own
      # defaults, which are sane for one admin panel's worth of TOTP factors.
      GOTRUE_MFA_ENABLED: 'true'

  # ─── POSTGREST ────────────────────────────────────────────────────────────
  supabase-rest:
    image: postgrest/postgrest:v12.0.2
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-roles:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:your-super-secret-and-long-postgres-password@supabase-db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_APP_SETTINGS_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      PGRST_APP_SETTINGS_JWT_EXP: '3600'
    command: postgrest

  # ─── STORAGE ──────────────────────────────────────────────────────────────
  supabase-storage:
    image: supabase/storage-api:v0.46.4
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-roles:
        condition: service_completed_successfully
      supabase-rest:
        condition: service_started
    healthcheck:
      # 127.0.0.1, not localhost — this image resolves localhost to ::1 first,
      # but the server only binds IPv4 0.0.0.0, so ::1 gets connection refused.
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:5000/status']
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3MTM0MjUsImV4cCI6MjEwMDA3MzQyNX0.huyd4oVy5PuVy7Bkk2okDXh0zlAx9KgEbNdwMactLuM
      SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NDcxMzQyNSwiZXhwIjoyMTAwMDczNDI1fQ.5h1scd1HcpX3H5EZv6OfrbG5af-_eNoCyqNsRwm8ozE
      POSTGREST_URL: http://supabase-rest:3000
      PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      DATABASE_URL: postgres://supabase_storage_admin:your-super-secret-and-long-postgres-password@supabase-db:5432/postgres
      FILE_SIZE_LIMIT: '52428800'
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: local
      GLOBAL_S3_BUCKET: local
      ENABLE_IMAGE_TRANSFORMATION: 'false'
    volumes:
      - supabase-storage-data:/var/lib/storage

  # ─── POSTGRES META ────────────────────────────────────────────────────────
  supabase-meta:
    image: supabase/postgres-meta:v0.96.6
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PG_META_PORT: '8080'
      PG_META_DB_HOST: supabase-db
      PG_META_DB_PORT: '5432'
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: your-super-secret-and-long-postgres-password

  # ─── KONG API GATEWAY (port 54321 = Supabase local URL) ──────────────────
  supabase-kong:
    image: kong:2.8.1
    restart: unless-stopped
    depends_on:
      supabase-auth:
        condition: service_healthy
      supabase-rest:
        condition: service_started
    ports:
      - '54321:8000/tcp'
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DEFAULT_ERROR_MESSAGE_FORMAT: json
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_LOG_LEVEL: warn
    volumes:
      - ./docker/kong.yml:/var/lib/kong/kong.yml:ro
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─── SUPABASE STUDIO (optional admin UI at :54323) ─────────────────────────
  supabase-studio:
    image: supabase/studio:2026.07.20-sha-74a0848
    restart: unless-stopped
    depends_on:
      supabase-kong:
        condition: service_healthy
    ports:
      - '54323:3000'
    environment:
      HOSTNAME: 0.0.0.0
      STUDIO_PG_META_URL: http://supabase-meta:8080
      POSTGRES_PASSWORD: your-super-secret-and-long-postgres-password
      DEFAULT_ORGANIZATION_NAME: OPTEX Opticians
      DEFAULT_PROJECT_NAME: optex-local
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_PUBLIC_URL: http://localhost:54321
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3MTM0MjUsImV4cCI6MjEwMDA3MzQyNX0.huyd4oVy5PuVy7Bkk2okDXh0zlAx9KgEbNdwMactLuM
      SUPABASE_SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NDcxMzQyNSwiZXhwIjoyMTAwMDczNDI1fQ.5h1scd1HcpX3H5EZv6OfrbG5af-_eNoCyqNsRwm8ozE
      AUTH_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      LOGFLARE_LOGGER_BACKEND_API_KEY: ''
      LOGFLARE_API_URL: http://localhost

  # ─── OPTEX NESTJS API ─────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: optex-api:local
    restart: unless-stopped
    depends_on:
      supabase-kong:
        condition: service_healthy
      supabase-migrate:
        condition: service_completed_successfully
    env_file:
      # Optional: the compose defaults below are enough to boot, and CI has no
      # apps/api/.env. A missing file used to abort `docker compose up api`.
      - path: apps/api/.env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # 1111, matching `pnpm dev:api` and CLAUDE.md. This service was still on
      # 4000 — one of the stale ports c068fa9 set out to remove — which meant
      # the containerised API answered somewhere nothing was configured to look.
      PORT: '1111'
      SUPABASE_URL: http://supabase-kong:8000
      # The public-facing Supabase URL used by browsers. The service-role client
      # connects via the internal Docker hostname above, but getPublicUrl() would
      # return that internal URL which browsers cannot reach. This env var lets
      # the API rewrite storage URLs to the correct public address.
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:54321}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3MTM0MjUsImV4cCI6MjEwMDA3MzQyNX0.huyd4oVy5PuVy7Bkk2okDXh0zlAx9KgEbNdwMactLuM}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NDcxMzQyNSwiZXhwIjoyMTAwMDczNDI1fQ.5h1scd1HcpX3H5EZv6OfrbG5af-_eNoCyqNsRwm8ozE}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      # Production-safe 10/min by default (F-01) — see AuthController. The
      # storefront's own Playwright suite (`smoke` CI job) signs up a real
      # throwaway account per test across several spec files and runs them
      # sequentially, which adds up to more than 10 signups inside one run and
      # trips the same ceiling that stops credential stuffing. CI overrides
      # this via the workflow's own `AUTH_RATE_LIMIT` env var; local runs of
      # `pnpm --filter @optex/web test:e2e` inherit the container default and
      # should export the same override first if the full suite is flaking on
      # a stray 429 during signup.
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10}
    ports:
      - '1111:1111'
    init: true
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:1111/api/health']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

volumes:
  supabase-db-data:
  supabase-storage-data:
